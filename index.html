overflow-wrap:anywhere}.action{background:var(--olive);color:#fff;padding:12px 18px;border:0;border-radius:22px;display:inline-block;text-decoration:none}.back{border:0;background:none;color:var(--olive)}.footer{text-align:center;color:#827b6b;padding:24px;font-size:12px}

body{background:#eae5db}.app{max-width:760px;box-shadow:0 20px 80px #2b281a18}.hero{height:570px;padding:54px 28px 26px;background:linear-gradient(180deg,#161b13a8 0%,#161b1322 43%,#f8f4eb 98%),var(--photo) center/cover}.brand{font-size:clamp(33px,6vw,48px);letter-spacing:.025em;line-height:1.12}.welcome{padding:22px 12px 0}.welcome h1{font-size:clamp(35px,6vw,49px);letter-spacing:-.03em}.welcome p{font-size:15px;max-width:430px;margin:13px auto;line-height:1.75}.content{padding:24px clamp(20px,5vw,48px)}.content h2{font-size:29px;margin:35px 0 17px}.quick{gap:11px}.quick button{background:#f1eadf;border:1px solid #e3d9c9;border-radius:13px;min-height:98px;font-size:12px;color:#3b4634;transition:transform .2s,background .2s}.quick button:hover,.card:hover{transform:translateY(-2px);background:#fffdf8}.quick span{font-size:26px}.card{background:#fffdf9;border:1px solid #e8e0d4;border-radius:13px;padding:23px 21px;box-shadow:0 5px 24px #3d352108;transition:transform .2s,background .2s}.card strong{font-size:24px}.card small{font-size:13px;color:#716e64}.card .arrow{font-size:23px;color:#8b907b}.bottom{width:min(760px,100%);border-radius:16px 16px 0 0;padding:14px 0 19px;box-shadow:0 -8px 28px #0001}.bottom button{font-size:11px}.bottom span{margin-bottom:5px}.page{padding:42px clamp(22px,6vw,65px)}.page h1{font-size:clamp(38px,6vw,50px)}.panel{border:1px solid #e7dfd2;border-radius:13px;padding:25px;background:#fffdf9}.action{border-radius:8px;padding:14px 22px}.footer{font-size:11px;letter-spacing:.08em;padding:30px 20px 35px}.global-language{background:#394532e8;right:max(14px,calc((100vw - 740px)/2));top:15px;backdrop-filter:blur(12px)}.gallery-heading{margin:42px 0 10px;font:30px Georgia,serif}.gallery-lead{color:#726c60;line-height:1.7;font-size:14px;margin-bottom:18px}.gallery-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.gallery-grid figure{margin:0;position:relative;overflow:hidden;border-radius:12px;background:#e9e0d4}.gallery-grid img{width:100%; </style></head><body><label for="globalLanguage" style="position:absolute;left:-9999px">Idioma</label><select id="globalLanguage" class="global-language" aria-label="Idioma" onchange="setLanguage(this.value)"><option value="pt">🇵🇹 PT</option><option value="en">🇬🇧 EN</option><option value="es">🇪🇸 ES</option><option value="fr">🇫🇷 FR</option></select><main class="app" id="app"></main><nav class="bottom" id="nav"></nav><script>
const UI={pt:['Início','A Estadia','Descobrir','Experiências','Anfitriões','Wi-Fi','Check-in / Check-out','Copiar palavra-passe','Copiada!','Contactar','Informações úteis','Emergência: 112'],en:['Home','Your Stay','Explore','Experiences','Hosts','Wi-Fi','Check-in / Check-out','Copy password','Copied!','Contact','Useful information','Emergency: 112'],es:['Inicio','Estancia','Descubrir','Experiencias','Anfitriones','Wi-Fi','Entrada / Salida','Copiar contraseña','¡Copiada!','Contacto','Información útil','Emergencias: 112'],fr:['Accueil','Séjour','Découvrir','Expériences','Hôtes','Wi-Fi','Arrivée / Départ','Copier le mot de passe','Copié !','Contact','Infos utiles','Urgence : 112']};let data=null,lang=localStorage.getItem('guestLang')||'pt',page='home';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tx=k=>data.texts[lang]?.[k]||data.texts.pt[k]||'';const u=i=>UI[lang][i];const PLACE_LABELS={pt:{map:'Ver no Google Maps',empty:'Em breve, as nossas sugestões para descobrir o Gerês.'},en:{map:'View on Google Maps',empty:'Our favourite places to explore in Gerês are coming soon.'},es:{map:'Ver en Google Maps',empty:'Próximamente, nuestras recomendaciones para descubrir Gerês.'},fr:{map:'Voir sur Google Maps',empty:'Nos bonnes adresses pour découvrir le Gerês arrivent bientôt.'}};
function placeText(place,key){return place.translations?.[lang]?.[key]||place.translations?.pt?.[key]||''}
function safeImage(value){if(typeof value!=='string')return '';const s=value.trim();if(/^data:image\/(?:png|jpeg|webp|gif);base64,[A-Za-z0-9+/=]+$/.test(s))return s;if(/^https:\/\/[^\s<>"']+$/i.test(s))return s;if(/^assets\/[a-zA-Z0-9_./-]+$/.test(s)&&!s.includes('..'))return s;return ''}
function safeMap(value){if(typeof value!=='string')return '';try{const u=new URL(value);return u.protocol==='https:'&&(u.hostname==='google.com'||u.hostname.endsWith('.google.com')||u.hostname==='maps.app.goo.gl'||u.hostname==='maps.google.com')?u.href:''}catch{return ''}}
const EXTRA_LABELS={pt:{food:'Gastronomia',directions:'Obter direções',call:'Ligar',foodEmpty:'Em breve, as nossas sugestões de restaurantes.',experienceEmpty:'Em breve, as nossas experiências favoritas.',reserve:'Reservar experiência',offer:'Aproveite 15% de desconto em todas as atividades da Equicampo durante a sua estadia na Casinha D’Aldeia.'},en:{food:'Food & Dining',directions:'Get directions',call:'Call',foodEmpty:'Our restaurant recommendations are coming soon.',experienceEmpty:'Our recommended experiences are coming soon.',reserve:'Book experience',offer:'Enjoy 15% off all Equicampo activities during your stay at Casinha D’Aldeia.'},es:{food:'Gastronomía',directions:'Cómo llegar',call:'Llamar',foodEmpty:'Próximamente, nuestras recomendaciones gastronómicas.',experienceEmpty:'Próximamente, nuestras experiencias recomendadas.',reserve:'Reservar experiencia',offer:'Disfruta de un 15 % de descuento en todas las actividades de Equicampo durante tu estancia en Casinha D’Aldeia.'},fr:{food:'Gastronomie',directions:'Itinéraire',call:'Appeler',foodEmpty:'Nos bonnes adresses gourmandes arrivent bientôt.',experienceEmpty:'Nos expériences recommandées arrivent bientôt.',reserve:'Réserver',offer:'Profitez de 15 % de réduction sur toutes les activités Equicampo pendant votre séjour à Casinha D’Aldeia.'}};
function safePhone(value){if(typeof value!=='string')return '';const s=value.trim();return /^\+?[0-9][0-9 .()\-]{5,22}$/.test(s)?s.replace(/[^+0-9]/g,''):''}
function safeDirections(value){return safeMap(value)}
function safeBooking(value){if(typeof value!=='string')return '';try{const url=new URL(value);return url.protocol==='https:'?url.href:''}catch{return ''}}
const LEGACY_OFFER={"pt": "15% de desconto exclusivo para os nossos hóspedes. Aproveite 15% de desconto em todas as atividades da Equicampo durante a sua estadia na Casinha D’Aldeia.", "en": "Exclusive 15% discount for our guests. Enjoy 15% off all Equicampo activities during your stay at Casinha D’Aldeia.", "es": "15 % de descuento exclusivo para nuestros huéspedes. Disfruta de un 15 % de descuento en todas las actividades de Equicampo durante tu estancia en Casinha D’Aldeia.", "fr": "15 % de réduction exclusive pour nos hôtes. Profitez de 15 % de réduction sur toutes les activités Equicampo pendant votre séjour à Casinha D’Aldeia."};
function recommendationCards(kind){const field={discover:'places',food:'restaurants',experiences:'activities'}[kind];const items=Array.isArray(data[field])?data[field]:[];const labels=PLACE_LABELS[lang]||PLACE_LABELS.pt;const extra=EXTRA_LABELS[lang]||EXTRA_LABELS.pt;const storedOffer=data.texts?.[lang]?.equicampoOffer||data.texts?.pt?.equicampoOffer||extra.offer;const offerText=LEGACY_OFFER[lang]===storedOffer?extra.offer:storedOffer;const empty=kind==='discover'?labels.empty:kind==='food'?extra.foodEmpty:extra.experienceEmpty;return items.length?`<div class="places-list">${items.map(item=>{const title=placeText(item,'name'),description=placeText(item,'description'),photo=safeImage(item.image),link=kind==='experiences'?safeBooking(item.booking):safeMap(item.maps);const button=kind==='experiences'?extra.reserve:labels.map;return `<article class="place-card">${photo?`<img class="place-photo" src="${e(photo)}" alt="${e(title)}" loading="lazy">`:''}<div class="place-info"><h2>${e(title)}</h2>${kind==='experiences'&&item.company?.trim()?`<div class="activity-company">${e(item.company.trim())}</div>`:''}${kind!=='food'&&description?`<p>${e(description)}</p>`:''}${kind==='food'?(item.locality||safePhone(item.phone)?`<div class="restaurant-meta">${item.locality?`<div class="restaurant-locality">${e(item.locality)}</div>`:''}${safePhone(item.phone)?`<div class="restaurant-number">${e(item.phone)}</div>`:''}</div>`:''):''}${kind==='experiences'&&(item.locality||safePhone(item.phone))?`<div class="restaurant-meta">${item.locality?`<div class="restaurant-locality">${e(item.locality)}</div>`:''}${safePhone(item.phone)?`<div class="restaurant-number">${e(item.phone)}</div>`:''}</div>`:''}${kind==='experiences'&&item.equicampo?`<div class="experience-offer">${e(offerText)}</div>`:''}${kind==='food'?`<div class="restaurant-actions">${safeDirections(item.directions||item.maps)?`<a class="place-map" href="${e(safeDirections(item.directions||item.maps))}" target="_blank" rel="noopener noreferrer">${e(extra.directions)}</a>`:''}${safePhone(item.phone)?`<a class="place-map restaurant-phone" href="tel:${e(safePhone(item.phone))}">${e(extra.call)}</a>`:''}</div>`:(kind==='experiences'?`<div class="restaurant-actions">${link?`<a class="place-map" href="${e(link)}" target="_blank" rel="noopener noreferrer">${e(button)}</a>`:''}${safePhone(item.phone)?`<a class="place-map restaurant-phone" href="tel:${e(safePhone(item.phone))}">${e(extra.call)}</a>`:''}</div>`:(link?`<a class="place-map" href="${e(link)}" target="_blank" rel="noopener noreferrer">${e(button)}</a>`:''))}</div></article>`}).join('')}</div>`:`<div class="panel">${e(empty)}</div>`}
function setLanguage(value){if(!['pt','en','es','fr'].includes(value))return;lang=value;localStorage.setItem('guestLang',lang);render()}function go(p){page=p;render();scrollTo(0,0)}function card(icon,title,sub,target){return `<button class="card" onclick="go('${target}')"><span class="ico">${icon}</span><span><strong>${e(title)}</strong></span><span class="arrow">›</span></button>`}function render(){document.documentElement.lang=lang;document.getElementById('globalLanguage').value=lang;let h='';if(page==='home'){h=`<div class="hero" style="--photo:url('${encodeURI(data.heroImage).replaceAll("'",'%27')}')"><select class="lang" aria-label="Language" onchange="lang=this.value;localStorage.setItem('guestLang',lang);render()">${['pt','en','es','fr'].map(x=>`<option value="${x}" ${x===lang?'selected':''}>${x.toUpperCase()}</option>`).join('')}</select><div class="brand">⌂<div>${e(data.brand)}</div></div><div class="welcome"><h1>${e(tx('welcome'))}</h1><p>${e(tx('intro'))}</p></div></div><div class="content"><div class="quick">${[['◉',u(5),'wifi'],['⚿',u(6),'check'],['⌂',tx('guide'),'guide'],['✉',u(9),'hosts']].map(([ic,tt,pg])=>`<button onclick="go('${pg}')"><span>${ic}</span>${e(tt)}</button>`).join('')}</div><h2>${e(u(1))}</h2>${card('⌂',tx('guide'),tx('guideBody'),'guide')}${card('◈',tx('discover'),tx('discoverBody'),'discover')}${card('♨',tx('food')||EXTRA_LABELS[lang].food,'','food')}${card('☆',tx('experiences'),tx('experiencesBody'),'experiences')}${card('ⓘ',u(10),u(11),'useful')}</div>`}else{const titles={stay:u(1),wifi:u(5),check:u(6),guide:tx('guide'),discover:tx('discover'),food:tx('food')||EXTRA_LABELS[lang].food,experiences:tx('experiences'),hosts:tx('hosts'),useful:u(10),rules:tx('rules')};h=`<div class="page"><button class="back" onclick="go('home')">← ${e(u(0))}</button><div class="brand" style="color:var(--olive);font-size:23px">${e(data.brand)}</div><h1>${e(titles[page])}</h1>`;if(page==='stay')h+=card('◉',u(5),'','wifi')+card('⚿',u(6),'','check')+card('⌂',tx('guide'),'','guide')+card('▤',tx('rules'),'','rules');if(page==='wifi')h+=`<div class="panel"><b>Wi-Fi</b><p>${e(data.wifiName)||'—'}</p><b>Password</b><p>${e(data.wifiPassword)||'—'}</p><button class="action" onclick="navigator.clipboard.writeText(data.wifiPassword).then(()=>alert(u(8)))">${e(u(7))}</button></div>`;if(page==='check')h+=`<div class="panel"><b>Check-in</b><p>${e(data.checkin)||'—'}</p><b>Check-out</b><p>${e(data.checkout)||'—'}</p></div>`;if(['guide','rules'].includes(page))h+=`<div class="panel">${e(tx(page+'Body'))}</div>`;if(page==='discover'){const intro=tx('discoverBody');if(intro)h+=`<div class="place-intro">${e(intro)}</div>`;h+=recommendationCards('discover')}if(page==='food')h+=recommendationCards('food');if(page==='experiences'){const intro=tx('experiencesBody');if(intro)h+=`<div class="place-intro">${e(intro)}</div>`;h+=recommendationCards('experiences')}if(page==='hosts')h+=`<div class="panel">${e(tx('intro'))}</div>${data.whatsapp?`<a class="action" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(data.whatsapp.replace(/\D/g,''))}">WhatsApp</a>`:''}`;if(page==='useful')h+=`<div class="panel">${e(u(11))}<p>${e(data.address)}</p></div>`;h+='</div>'}document.getElementById('app').innerHTML=h+'<div class="footer">Made with care · Casinha D’Aldeia</div>';document.getElementById('nav').innerHTML=[['home','⌂',u(0)],['stay','▤',u(1)],['discover','◈',u(2)],['experiences','☆',u(3)],['hosts','♧',u(4)]].map(([p,ic,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${ic}</span>${e(t)}</button>`).join('')}
const previewMode=new URLSearchParams(location.search).get('preview')==='1' && window.parent!==window;
if(previewMode){
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==window.parent)return;
    if(event.data?.type==='casinha-preview-language'){setLanguage(event.data.language);return;}if(event.data?.type!=='casinha-preview-data')return;
    const next=event.data.payload;
    if(!next||typeof next!=='object'||!next.texts||!next.texts.pt)return;
    data=next;render();
  });
  document.getElementById('app').textContent='A preparar a pré-visualização…';
  window.parent.postMessage({type:'casinha-preview-ready'},location.origin);
  // Retry the handshake until the parent sends the preview content.
  let attempts=0;const handshake=setInterval(()=>{
    if(data||++attempts>25){clearInterval(handshake);if(!data)document.getElementById('app').textContent='Não foi possível carregar a pré-visualização. Fecha e abre novamente.';return;}
    window.parent.postMessage({type:'casinha-preview-ready'},location.origin);
  },400);
}else{
  fetch('content.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('content.json');return r.json()}).then(d=>{data=d;render()}).catch(()=>{document.getElementById('app').textContent='Não foi possível carregar o guia. Atualize a página.'});
}
</script></body></html>
