<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#343d25"><title>Casinha D’Aldeia · Guest Guide</title><style>
:root{--olive:#343d25;--cream:#f6f0e6;--ink:#302d25;--sand:#e9decb}*{box-sizing:border-box}body{margin:0;background:#ddd5c7;color:var(--ink);font-family:system-ui,Arial,sans-serif}button,a{cursor:pointer}button{font:inherit}.app{max-width:560px;margin:auto;min-height:100vh;background:var(--cream);padding-bottom:90px}h1,h2,.brand{font-family:Georgia,serif;font-weight:400}.hero{height:440px;background:linear-gradient(180deg,#0008,#0000 50%,#f6f0e6 99%),var(--photo) center/cover;position:relative;text-align:center;color:white;padding:72px 20px 10px;display:flex;flex-direction:column}.brand{font-size:33px;text-shadow:0 1px 9px #0007}.lang{position:absolute;right:18px;top:18px;background:var(--olive);color:white;border:1px solid #fff7;border-radius:24px;padding:10px}.welcome{margin-top:auto;color:var(--ink)}.welcome h1{font-size:35px;margin:0}.welcome p{line-height:1.5}.content{padding:18px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.quick button{background:var(--sand);border:0;border-radius:17px;min-height:88px;padding:8px 3px;font-size:12px}.quick span{display:block;font-size:25px;margin-bottom:8px}.card{display:flex;align-items:center;text-align:left;gap:15px;background:#fffaf3;border:1px solid #e7dccb;border-radius:18px;padding:19px;margin:12px 0;width:100%;color:inherit;box-shadow:0 3px 12px #3d35210b}.card .ico{font-size:25px}.card strong{font:23px Georgia,serif}.card small{display:block;margin-top:5px;line-height:1.5}.card .arrow{margin-left:auto}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:var(--olive);display:grid;grid-template-columns:repeat(5,1fr);padding:12px 0 18px;border-radius:20px 20px 0 0}.bottom button{background:none;border:0;color:#fff;font-size:11px}.bottom span{display:block;font-size:24px}.bottom .active{color:#e9d49e}.page{padding:30px 20px}.page h1{font-size:36px}.panel{background:#fffaf3;border-radius:18px;padding:20px;line-height:1.7;margin:15px 0;white-space:pre-wrap;overflow-wrap:anywhere}.action{background:var(--olive);color:#fff;padding:12px 18px;border:0;border-radius:22px;display:inline-block;text-decoration:none}.back{border:0;background:none;color:var(--olive)}.footer{text-align:center;color:#827b6b;padding:24px;font-size:12px}
.global-language{position:fixed;top:12px;right:12px;z-index:20;background:#343d25;color:white;border:1px solid #d8caa9;border-radius:22px;padding:9px 12px;box-shadow:0 3px 12px #0002}.hero .lang{display:none}</style></head><body><main class="app" id="app"></main><nav class="bottom" id="nav"></nav><script>
const UI={pt:['Início','A Estadia','Descobrir','Experiências','Anfitriões','Wi-Fi','Check-in / Check-out','Copiar palavra-passe','Copiada!','Contactar','Informações úteis','Emergência: 112'],en:['Home','Your Stay','Explore','Experiences','Hosts','Wi-Fi','Check-in / Check-out','Copy password','Copied!','Contact','Useful information','Emergency: 112'],es:['Inicio','Estancia','Descubrir','Experiencias','Anfitriones','Wi-Fi','Entrada / Salida','Copiar contraseña','¡Copiada!','Contacto','Información útil','Emergencias: 112'],fr:['Accueil','Séjour','Découvrir','Expériences','Hôtes','Wi-Fi','Arrivée / Départ','Copier le mot de passe','Copié !','Contact','Infos utiles','Urgence : 112']};let data=null,lang=localStorage.getItem('guestLang')||'pt',page='home';const e=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const tx=k=>data.texts[lang]?.[k]||data.texts.pt[k]||'';const u=i=>UI[lang][i];function setLanguage(value){if(!['pt','en','es','fr'].includes(value))return;lang=value;localStorage.setItem('guestLang',lang);render()}function go(p){page=p;render();scrollTo(0,0)}function card(icon,title,sub,target){return `<button class="card" onclick="go('${target}')"><span class="ico">${icon}</span><span><strong>${e(title)}</strong><small>${e(sub)}</small></span><span class="arrow">›</span></button>`}function render(){document.documentElement.lang=lang;document.getElementById('globalLanguage').value=lang;let h='';if(page==='home'){h=`<div class="hero" style="--photo:url('${encodeURI(data.heroImage).replaceAll("'",'%27')}')"><select class="lang" aria-label="Language" onchange="lang=this.value;localStorage.setItem('guestLang',lang);render()">${['pt','en','es','fr'].map(x=>`<option value="${x}" ${x===lang?'selected':''}>${x.toUpperCase()}</option>`).join('')}</select><div class="brand">⌂<div>${e(data.brand)}</div></div><div class="welcome"><h1>${e(tx('welcome'))}</h1><p>${e(tx('intro'))}</p></div></div><div class="content"><div class="quick">${[['◉',u(5),'wifi'],['⚿',u(6),'check'],['⌂',tx('guide'),'guide'],['✉',u(9),'hosts']].map(([ic,tt,pg])=>`<button onclick="go('${pg}')"><span>${ic}</span>${e(tt)}</button>`).join('')}</div><h2>${e(u(1))}</h2>${card('⌂',tx('guide'),tx('guideBody'),'guide')}${card('◈',tx('discover'),tx('discoverBody'),'discover')}${card('☆',tx('experiences'),tx('experiencesBody'),'experiences')}${card('ⓘ',u(10),u(11),'useful')}</div>`}else{const titles={stay:u(1),wifi:u(5),check:u(6),guide:tx('guide'),discover:tx('discover'),experiences:tx('experiences'),hosts:tx('hosts'),useful:u(10),rules:tx('rules')};h=`<div class="page"><button class="back" onclick="go('home')">← ${e(u(0))}</button><div class="brand" style="color:var(--olive);font-size:23px">${e(data.brand)}</div><h1>${e(titles[page])}</h1>`;if(page==='stay')h+=card('◉',u(5),'','wifi')+card('⚿',u(6),'','check')+card('⌂',tx('guide'),'','guide')+card('▤',tx('rules'),'','rules');if(page==='wifi')h+=`<div class="panel"><b>Wi-Fi</b><p>${e(data.wifiName)||'—'}</p><b>Password</b><p>${e(data.wifiPassword)||'—'}</p><button class="action" onclick="navigator.clipboard.writeText(data.wifiPassword).then(()=>alert(u(8)))">${e(u(7))}</button></div>`;if(page==='check')h+=`<div class="panel"><b>Check-in</b><p>${e(data.checkin)||'—'}</p><b>Check-out</b><p>${e(data.checkout)||'—'}</p></div>`;if(['guide','discover','experiences','rules'].includes(page))h+=`<div class="panel">${e(tx(page+'Body'))}</div>`;if(page==='hosts')h+=`<div class="panel">${e(tx('intro'))}</div>${data.whatsapp?`<a class="action" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(data.whatsapp.replace(/\D/g,''))}">WhatsApp</a>`:''}`;if(page==='useful')h+=`<div class="panel">${e(u(11))}<p>${e(data.address)}</p></div>`;h+='</div>'}document.getElementById('app').innerHTML=h+'<div class="footer">Made with care · Casinha D’Aldeia</div>';document.getElementById('nav').innerHTML=[['home','⌂',u(0)],['stay','▤',u(1)],['discover','◈',u(2)],['experiences','☆',u(3)],['hosts','♧',u(4)]].map(([p,ic,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${ic}</span>${e(t)}</button>`).join('')}
const previewMode=new URLSearchParams(location.search).get('preview')==='1' && window.parent!==window;
if(previewMode){
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==window.parent)return;
    if(event.data?.type==='casinha-preview-language'){setLanguage(event.data.language);return;}if(event.data?.type!=='casinha-preview-data')return;
    const next=event.data.payload;
    if(!next||typeof next!=='object'||!next.texts||!next.texts.pt)return;
    data=next;render();
  });
  document.getElementById('app').textContent='A preparar a pré-visualização…';
  window.parent.postMessage({type:'casinha-preview-ready'},location.origin);
  // Retry the handshake until the parent sends the preview content.
  let attempts=0;const handshake=setInterval(()=>{
    if(data||++attempts>25){clearInterval(handshake);if(!data)document.getElementById('app').textContent='Não foi possível carregar a pré-visualização. Fecha e abre novamente.';return;}
    window.parent.postMessage({type:'casinha-preview-ready'},location.origin);
  },400);
}else{
  fetch('content.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('content.json');return r.json()}).then(d=>{data=d;render()}).catch(()=>{document.getElementById('app').textContent='Não foi possível carregar o guia. Atualize a página.'});
}
</script></body></html>
