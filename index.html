function menuPhoto(target){const selected=data.menuImages?.[target];if(safeImage(selected))return safeImage(selected);if(target==='stay'||target==='guide')return safeImage(data.heroImage);if(target==='discover')return safeImage(data.places?.find(x=>safeImage(x.image))?.image);if(target==='food')return safeImage(data.restaurants?.find(x=>safeImage(x.image))?.image);if(target==='experiences')return safeImage(data.activities?.find(x=>safeImage(x.image))?.image);return safeImage(data.heroImage)}
function menuCard(target,title,icon){const photo=menuPhoto(target),copy=MENU_COPY[lang]||MENU_COPY.pt;return `<button class="home-menu-card" onclick="go('${target}')">${photo?`<img class="home-menu-picture" src="${e(photo)}" alt="" loading="lazy">`:`<span class="home-menu-picture home-menu-picture-empty">${ico(icon)}</span>`}<span class="home-menu-copy"><span class="home-menu-title">${ico(icon)}<span>${e(title)}</span></span><span class="home-menu-sub">${e(copy[target]||'')}</span></span><span class="home-menu-arrow">${ico('chevron')}</span></button>`}

const HOST_DEFAULTS={"pt": "Por detrás da Casinha D’Aldeia está a Equicampo, uma empresa nascida em 1995, no coração do Parque Nacional da Peneda-Gerês, de uma paixão pela natureza, pelos cavalos e por esta região tão especial.\n\nHá mais de 30 anos que partilhamos o melhor do Gerês com quem nos visita, através de passeios a cavalo, caminhadas, atividades de aventura e experiências que convidam a descobrir a serra de uma forma autêntica.\n\nA Casinha D’Aldeia é uma extensão dessa vontade de acolher. Um lugar para descansar, abrandar e sentir o Gerês ao seu ritmo.\n\nEstamos por perto e sempre disponíveis para ajudar a tornar a sua estadia especial.", "en": "Behind Casinha D’Aldeia is Equicampo, a company founded in 1995 in the heart of Peneda-Gerês National Park, inspired by a love of nature, horses and this special region.\n\nFor more than 30 years, we have shared the best of Gerês with our visitors through horse riding, guided walks and outdoor adventures.\n\nCasinha D’Aldeia is an extension of that same spirit of hospitality: a place to rest, slow down and discover Gerês at your own pace.\n\nWe are nearby and always happy to help make your stay special.", "es": "Detrás de Casinha D’Aldeia está Equicampo, una empresa fundada en 1995 en el corazón del Parque Nacional de Peneda-Gerês, nacida de la pasión por la naturaleza, los caballos y esta región tan especial.\n\nDesde hace más de 30 años compartimos lo mejor del Gerês a través de paseos a caballo, rutas a pie y actividades de aventura.\n\nCasinha D’Aldeia prolonga ese espíritu de hospitalidad: un lugar para descansar, bajar el ritmo y descubrir el Gerês a tu manera.\n\nEstamos cerca y siempre disponibles para ayudarte a disfrutar de una estancia especial.", "fr": "Derrière Casinha D’Aldeia se trouve Equicampo, une entreprise fondée en 1995 au cœur du parc national de Peneda-Gerês, née d’une passion pour la nature, les chevaux et cette région si particulière.\n\nDepuis plus de 30 ans, nous partageons les richesses du Gerês avec nos visiteurs grâce aux balades à cheval, aux randonnées et aux activités de plein air.\n\nCasinha D’Aldeia prolonge cet esprit d’accueil : un lieu pour se reposer, ralentir et découvrir le Gerês à son rythme.\n\nNous sommes à proximité et toujours disponibles pour rendre votre séjour agréable."};const HOST_ACTIONS={"pt": {"heading": "Conheça a Equicampo", "call": "Ligar", "website": "Conhecer a Equicampo"}, "en": {"heading": "Meet Equicampo", "call": "Call", "website": "Discover Equicampo"}, "es": {"heading": "Conoce Equicampo", "call": "Llamar", "website": "Conocer Equicampo"}, "fr": {"heading": "Découvrez Equicampo", "call": "Appeler", "website": "Découvrir Equicampo"}};const STAY_LABELS={pt:{directions:'Obter direções',call:'Ligar',copy:'Copiar palavra-passe',copied:'Palavra-passe copiada!',checkin:'Check-in',checkout:'Check-out',network:'Rede',password:'Palavra-passe',more:'Contactar para pedir mais lenha',book:'Consultar'},en:{directions:'Get directions',call:'Call',copy:'Copy password',copied:'Password copied!',checkin:'Check-in',checkout:'Check-out',network:'Network',password:'Password',more:'Request more firewood',book:'Open link'},es:{directions:'Cómo llegar',call:'Llamar',copy:'Copiar contraseña',copied:'¡Contraseña copiada!',checkin:'Entrada',checkout:'Salida',network:'Red',password:'Contraseña',more:'Solicitar más leña',book:'Abrir enlace'},fr:{directions:'Itinéraire',call:'Appeler',copy:'Copier le mot de passe',copied:'Mot de passe copié !',checkin:'Arrivée',checkout:'Départ',network:'Réseau',password:'Mot de passe',more:'Demander du bois',book:'Ouvrir le lien'}};
function staySections(){return Array.isArray(data.staySections)&&data.staySections.length?data.staySections:STAY_DEFAULTS}
function stayText(item,key){return item.translations?.[lang]?.[key]||item.translations?.pt?.[key]||''}
function stayGuide(){const t=STAY_LABELS[lang]||STAY_LABELS.pt;const intro=data.texts?.[lang]?.stayIntro||data.texts?.pt?.stayIntro||'';return `${intro?`<p class="stay-intro">${e(intro)}</p>`:''}<div class="stay-list">${staySections().filter(x=>x.visible!==false).map(item=>{const title=stayText(item,'title'),body=stayText(item,'body');const image=safeImage(item.image);const buttonUrl=safeBooking(item.buttonUrl);const phone=safePhone(item.phone);const isCheck=item.id==='check',isWifi=item.id==='wifi';const isFire=item.id==='fireplace';const mapLink=safeMap(data.equicampoMaps||'');const whatsapp=data.whatsapp?`https://wa.me/${encodeURIComponent(data.whatsapp.replace(/\D/g,''))}`:'';return `<details class="stay-item" id="stay-${e(item.id)}"><summary>${ico(item.icon||'info')}<span class="stay-name">${e(title)}</span><span class="stay-chevron">⌄</span></summary><div class="stay-detail">${image?`<img src="${e(image)}" alt="" loading="lazy">`:''}${body?`<p>${e(body)}</p>`:''}${isCheck?`<div class="stay-meta"><strong>${e(t.checkin)}:</strong> ${e(data.checkin||'—')}<br><strong>${e(t.checkout)}:</strong> ${e(data.checkout||'—')}</div>`:''}${isWifi?`<div class="stay-meta"><strong>${e(t.network)}:</strong> ${e(data.wifiName||'—')}<br><strong>${e(t.password)}:</strong> ${e(data.wifiPassword||'—')}</div>`:''}<div class="stay-actions">${isWifi&&data.wifiPassword?`<button type="button" onclick="copyStayWifi()">${e(t.copy)}</button>`:''}${isCheck&&mapLink?`<a href="${e(mapLink)}" target="_blank" rel="noopener noreferrer">${e(t.directions)} · Equicampo</a>`:''}${isFire&&whatsapp?`<a href="${e(whatsapp)}" target="_blank" rel="noopener noreferrer">${e(t.more)}</a>`:''}${buttonUrl?`<a href="${e(buttonUrl)}" target="_blank" rel="noopener noreferrer">${e(item.buttonLabel||t.book)}</a>`:''}${phone?`<a class="secondary" href="tel:${e(phone)}">${e(t.call)}</a>`:''}</div></div></details>`}).join('')}</div>`}
function copyStayWifi(){navigator.clipboard.writeText(data.wifiPassword||'').then(()=>alert((STAY_LABELS[lang]||STAY_LABELS.pt).copied)).catch(()=>alert('Não foi possível copiar.'))}
function openStaySection(id){page='stay';render();scrollTo(0,0);const section=document.getElementById('stay-'+id);if(section){section.open=true;setTimeout(()=>section.scrollIntoView({behavior:'smooth',block:'center'}),80)}}

function setLanguage(value){if(!['pt','en','es','fr'].includes(value))return;lang=value;localStorage.setItem('guestLang',lang);render()}function go(p){page=p;render();scrollTo(0,0)}function card(icon,title,sub,target){return `<button class="card" onclick="go('${target}')"><span class="ico">${icon}</span><span><strong>${e(title)}</strong></span><span class="arrow">›</span></button>`}function render(){document.documentElement.lang=lang;document.getElementById('globalLanguage').value=lang;let h='';if(page==='home'){const copy=MENU_COPY[lang]||MENU_COPY.pt;h=`<div class="hero" style="--photo:url('${encodeURI(data.heroImage).replaceAll("'",'%27')}')"><div class="brand"><svg class="brand-mark" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 48 50 13l41 35M23 40v37m54-37v37M50 13v-8"/><path d="M43 70q8-26 27-36M49 58q-12-9-13-17M56 48q12 0 18-10M43 68q-12-1-17-11"/></svg><div>${e(data.brand)}</div><div class="brand-by">by Equicampo</div><div class="brand-rule"></div></div><div class="welcome"><h1>${e(tx('welcome'))}</h1><p>${e(tx('intro'))}</p></div></div><div class="content"><div class="quick">${[['wifi',u(5),'stay-wifi'],['key',u(6),'stay-check'],['compass',QUICK_DIRECTIONS[lang],'directions'],['phone',u(9),'hosts']].map(([ic,tt,pg])=>`<button onclick="${pg.startsWith('stay-')?`openStaySection('${pg.slice(5)}')`:`go('${pg}')`}">${ico(ic)}${e(tt)}</button>`).join('')}</div><div class="home-menu">${menuCard('stay',u(1),'bed')}${menuCard('discover',tx('discover'),'compass')}${menuCard('food',tx('food')||EXTRA_LABELS[lang].food,'food')}${menuCard('experiences',tx('experiences'),'star')}</div></div>`}else{const titles={stay:u(1),wifi:u(5),check:u(6),guide:tx('guide'),directions:QUICK_DIRECTIONS[lang],discover:tx('discover'),food:tx('food')||EXTRA_LABELS[lang].food,experiences:tx('experiences'),hosts:tx('hosts'),useful:u(10),rules:tx('rules')};h=`<div class="page"><button class="back" onclick="go('home')">← ${e(u(0))}</button><div class="brand" style="color:var(--olive);font-size:23px">${e(data.brand)}</div><h1>${e(titles[page])}</h1>`;if(page==='stay')h+=stayGuide();if(page==='directions'){const dest=safeMap(data.maps);h+=`<div class="panel">${e(data.address||'')}${dest?`<p><a class="action" href="${e(dest)}" target="_blank" rel="noopener noreferrer">${e(QUICK_DIRECTIONS[lang])}</a></p>`:''}</div>`}if(page==='wifi')h+=`<div class="panel"><b>Wi-Fi</b><p>${e(data.wifiName)||'—'}</p><b>Password</b><p>${e(data.wifiPassword)||'—'}</p><button class="action" onclick="navigator.clipboard.writeText(data.wifiPassword).then(()=>alert(u(8)))">${e(u(7))}</button></div>`;if(page==='check')h+=`<div class="panel"><b>Check-in</b><p>${e(data.checkin)||'—'}</p><b>Check-out</b><p>${e(data.checkout)||'—'}</p></div>`;if(['guide','rules'].includes(page))h+=`<div class="panel">${e(tx(page+'Body'))}</div>`;if(page==='discover'){const intro=tx('discoverBody');if(intro)h+=`<div class="place-intro">${e(intro)}</div>`;h+=recommendationCards('discover')}if(page==='food')h+=recommendationCards('food');if(page==='experiences'){const intro=tx('experiencesBody');if(intro)h+=`<div class="place-intro">${e(intro)}</div>`;h+=recommendationCards('experiences')}if(page==='hosts'){const hostBody=tx('hostsBody')||HOST_DEFAULTS[lang];const hostPhone=safePhone(data.hostPhone||'');const hostWhatsApp=data.whatsapp?data.whatsapp.replace(/\D/g,''):'';const hostWebsite=/^https:\/\/(?:www\.)?equicampo\.com\/?(?:[?#].*)?$/.test(data.hostWebsite||'')?data.hostWebsite:'https://equicampo.com/';const actions=[hostPhone?`<a class="action" href="tel:${e(hostPhone)}">${e(HOST_ACTIONS[lang].call)}</a>`:'',hostWhatsApp?`<a class="action" target="_blank" rel="noopener noreferrer" href="https://wa.me/${e(hostWhatsApp)}">WhatsApp</a>`:'',`<a class="action" target="_blank" rel="noopener noreferrer" href="${e(hostWebsite)}">${e(HOST_ACTIONS[lang].website)}</a>`].join('');const hostLogo=safeImage(data.hostLogo||'');const hostPhotos=(Array.isArray(data.hostPhotos)?data.hostPhotos:[]).map(photo=>safeImage(photo)).filter(Boolean);h+=`<div class="panel hosts-panel">${hostLogo?`<img class="hosts-logo" src="${e(hostLogo)}" alt="Equicampo" loading="lazy">`:''}<h2>${e(HOST_ACTIONS[lang].heading)}</h2><p>${e(hostBody)}</p>${hostPhotos.length?`<div class="hosts-gallery">${hostPhotos.map((photo,i)=>`<img src="${e(photo)}" alt="Equicampo · ${i+1}" loading="lazy">`).join('')}</div>`:''}</div><div class="hosts-actions">${actions}</div>`;}if(page==='useful')h+=`<div class="panel">${e(u(11))}<p>${e(data.address)}</p></div>`;h+='</div>'}document.getElementById('app').innerHTML=h+'<div class="footer">Made with care · Casinha D’Aldeia</div>';document.getElementById('nav').innerHTML=[['home','home',u(0)],['stay','bed',u(1)],['discover','compass',u(2)],['experiences','star',u(3)],['hosts','users',u(4)]].map(([p,ic,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${ico(ic)}<span>${e(t)}</span></button>`).join('')}
const previewMode=new URLSearchParams(location.search).get('preview')==='1' && window.parent!==window;
if(previewMode){
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==window.parent)return;
    if(event.data?.type==='casinha-preview-language'){setLanguage(event.data.language);return;}if(event.data?.type!=='casinha-preview-data')return;
    const next=event.data.payload;
    if(!next||typeof next!=='object'||!next.texts||!next.texts.pt)return;
    data=next;render();
  });
  document.getElementById('app').textContent='A preparar a pré-visualização…';
  window.parent.postMessage({type:'casinha-preview-ready'},location.origin);
  // Retry the handshake until the parent sends the preview content.
  let attempts=0;const handshake=setInterval(()=>{
    if(data||++attempts>25){clearInterval(handshake);if(!data)document.getElementById('app').textContent='Não foi possível carregar a pré-visualização. Fecha e abre novamente.';return;}
    window.parent.postMessage({type:'casinha-preview-ready'},location.origin);
  },400);
}else{
  fetch('content.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('content.json');return r.json()}).then(d=>{data=d;render()}).catch(()=>{document.getElementById('app').textContent='Não foi possível carregar o guia. Atualize a página.'});
}
