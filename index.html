<!doctype html><html lang="pt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#343d25"><meta name="description" content="Guia digital da Casinha D’Aldeia"><link rel="manifest" href="manifest.webmanifest"><title>Casinha D’Aldeia | Guest Guide</title><style>
:root{--olive:#343d25;--cream:#f6f0e6;--ink:#302d25;--sand:#e9decb}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Arial,sans-serif}h1,h2,h3,.brand{font-family:Georgia,serif;font-weight:400}button,a{cursor:pointer}button{font:inherit}.app{max-width:560px;margin:auto;min-height:100dvh;padding-bottom:90px}.hero{height:410px;position:relative;background:linear-gradient(180deg,#0007,#0000 42%,#f6f0e6 98%),url('assets/casa.jpg') center/cover;display:flex;flex-direction:column;align-items:center;padding:44px 20px 0;color:white;text-align:center}.hero:before{content:'⌂';font-size:52px;line-height:1}.brand{font-size:34px;text-shadow:0 1px 9px #0008}.lang{position:absolute;right:18px;top:18px;background:#343d25e8;border:1px solid #fff7;border-radius:22px;color:white;padding:9px}.welcome{margin-top:auto;color:var(--ink);padding-bottom:15px}.welcome h1{font-size:35px;margin:0 0 10px}.welcome p{line-height:1.5;margin:0}.content{padding:20px}.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.quick button{border:0;background:var(--sand);border-radius:18px;min-height:95px;padding:12px 4px;color:var(--ink);font-size:12px}.quick span{display:block;font-size:26px;margin-bottom:8px}.section-title{font-size:28px;margin:26px 0 15px}.card{display:flex;align-items:center;gap:16px;background:#fffaf3;border:1px solid #e7dccb;border-radius:19px;padding:17px;margin:12px 0;box-shadow:0 3px 12px #3d35210b;text-align:left;width:100%;color:inherit}.card .ico{font-size:29px;min-width:35px}.card strong{font-family:Georgia,serif;font-size:21px;font-weight:400}.card small{display:block;line-height:1.5;margin-top:5px}.arrow{margin-left:auto;font-size:23px}.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);display:grid;grid-template-columns:repeat(5,1fr);background:var(--olive);border-radius:20px 20px 0 0;padding:12px 0 max(12px,env(safe-area-inset-bottom));z-index:5}.bottom button{background:none;border:0;color:#fff;font-size:11px}.bottom span{display:block;font-size:23px;margin-bottom:5px}.bottom button.active{color:#f0d69c}.page{padding:30px 20px}.page h1{font-size:34px}.back{background:none;border:0;color:var(--olive);padding:0 0 15px}.panel{background:#fffaf3;border-radius:18px;padding:20px;margin:15px 0;line-height:1.6}.action{background:var(--olive);color:white;border:0;border-radius:24px;padding:12px 18px;text-decoration:none;display:inline-block;margin-top:8px}.muted{color:#716d60;font-size:14px}.placeholder{border-left:3px solid #b29d6e;padding-left:12px}.footer{text-align:center;color:#827b6b;padding:25px 10px;font-size:12px}@media(min-width:600px){body{background:#ddd5c7}.app{background:var(--cream)}}
</style></head><body><div id="app" class="app"></div><nav class="bottom" id="nav"></nav><script>
const DATA={wifiName:'PREENCHER_NOME_WIFI',wifiPassword:'PREENCHER_PASSWORD',checkin:'A confirmar',checkout:'A confirmar',whatsapp:'',address:'',maps:'',hero:'assets/casa.jpg'};
const translations={pt:{welcome:'Bem-vindo!',intro:'É um prazer recebê-lo na nossa casa. Esperamos que se sinta em casa e tenha uma estadia maravilhosa.',home:'Início',stay:'A Estadia',discover:'Descobrir',experiences:'Experiências',hosts:'Anfitriões',guide:'Guia da Casa',useful:'Informações Úteis',region:'Descobrir a Região',contact:'Contactar',wifi:'Wi-Fi',check:'Check-in & Check-out',all:'Tudo o que precisa para uma estadia perfeita',equipment:'Como utilizar os equipamentos',places:'Restaurantes e sugestões locais',activities:'Atividades, natureza e cultura',services:'Serviços, emergências e contactos',copy:'Copiar palavra-passe',copied:'Copiada!',soon:'Conteúdo a personalizar',emergency:'Emergências: 112',map:'Abrir mapa',message:'Enviar mensagem',back:'← Voltar'},en:{welcome:'Welcome!',intro:'We are delighted to welcome you. Make yourself at home and enjoy your stay.',home:'Home',stay:'Your Stay',discover:'Explore',experiences:'Experiences',hosts:'Hosts',guide:'House Guide',useful:'Useful Information',region:'Explore the Region',contact:'Contact',wifi:'Wi-Fi',check:'Check-in & Check-out',all:'Everything you need for a wonderful stay',equipment:'How to use the appliances',places:'Restaurants and local favourites',activities:'Activities, nature and culture',services:'Services, emergencies and contacts',copy:'Copy password',copied:'Copied!',soon:'Content to be personalised',emergency:'Emergency: 112',map:'Open map',message:'Send a message',back:'← Back'}};
let lang=localStorage.getItem('lang')||'pt',page='home';const t=k=>(translations[lang]||translations.pt)[k];const app=document.getElementById('app');function card(icon,title,desc,target){return `<button class="card" onclick="go('${target}')"><span class="ico">${icon}</span><span><strong>${title}</strong><small>${desc}</small></span><span class="arrow">›</span></button>`}function go(p){page=p;render();window.scrollTo(0,0)}function toggleLang(){lang=lang==='pt'?'en':'pt';localStorage.setItem('lang',lang);render()}function copyWifi(){navigator.clipboard.writeText(DATA.wifiPassword).then(()=>alert(t('copied')))}function render(){document.documentElement.lang=lang;let html='';if(page==='home'){html=`<div class="hero"><button class="lang" onclick="toggleLang()">◎ ${lang.toUpperCase()} ▾</button><div class="brand">Casinha D’Aldeia</div><div class="welcome"><h1>${t('welcome')}</h1><p>${t('intro')}</p></div></div><div class="content"><div class="quick"><button onclick="go('wifi')"><span>◉</span>${t('wifi')}</button><button onclick="go('check')"><span>⚿</span>${t('check')}</button><button onclick="go('guide')"><span>⌂</span>${t('guide')}</button><button onclick="go('hosts')"><span>✉</span>${t('contact')}</button></div><h2 class="section-title">${t('all')}</h2>${card('▤',t('stay'),t('check')+', '+t('wifi'),'stay')}${card('⌂',t('guide'),t('equipment'),'guide')}${card('◈',t('region'),t('places'),'discover')}${card('☆',t('experiences'),t('activities'),'experiences')}${card('ⓘ',t('useful'),t('services'),'useful')}</div>`}else{const titles={stay:t('stay'),wifi:t('wifi'),check:t('check'),guide:t('guide'),discover:t('region'),experiences:t('experiences'),hosts:t('hosts'),useful:t('useful')};html=`<div class="page"><button class="back" onclick="go('home')">${t('back')}</button><div class="brand" style="color:var(--olive);font-size:22px">Casinha D’Aldeia</div><h1>${titles[page]}</h1>`;if(page==='stay')html+=card('◉',t('wifi'),DATA.wifiName,'wifi')+card('⚿',t('check'),'', 'check')+card('⌂',t('guide'),t('equipment'),'guide')+card('ⓘ',t('useful'),t('services'),'useful');if(page==='wifi')html+=`<div class="panel"><div class="muted">Network / Rede</div><h2>${DATA.wifiName}</h2><div class="muted">Password</div><p>${DATA.wifiPassword}</p><button class="action" onclick="copyWifi()">${t('copy')}</button></div>`;if(page==='check')html+=`<div class="panel"><h3>Check-in</h3><p>${DATA.checkin}</p><h3>Check-out</h3><p>${DATA.checkout}</p></div>`;if(page==='guide')html+=`<div class="panel placeholder">${t('soon')}: aquecimento, cozinha, televisão, reciclagem, regras da casa e instruções com fotografias.</div>`;if(page==='discover')html+=`<div class="panel placeholder">${t('soon')}: restaurantes, cafés, passeios e locais favoritos dos anfitriões.</div>${DATA.maps?`<a class="action" href="${DATA.maps}" target="_blank">${t('map')}</a>`:''}`;if(page==='experiences')html+=`<div class="panel placeholder">${t('soon')}: experiências na natureza, cultura e sugestões sazonais.</div>`;if(page==='hosts')html+=`<div class="panel"><p>${t('intro')}</p>${DATA.whatsapp?`<a class="action" href="https://wa.me/${DATA.whatsapp}" target="_blank">${t('message')}</a>`:`<p class="placeholder">${t('soon')}: WhatsApp dos anfitriões.</p>`}</div>`;if(page==='useful')html+=`<div class="panel"><h3>${t('emergency')}</h3><p class="placeholder">${t('soon')}: farmácia, supermercado, centro de saúde e morada da casa.</p></div>`;html+='</div>'}html+='<div class="footer">Made with care · Casinha D’Aldeia</div>';app.innerHTML=html;const nav=[['home','⌂',t('home')],['stay','▤',t('stay')],['discover','◈',t('discover')],['experiences','☆',t('experiences')],['hosts','♧',t('hosts')]];document.getElementById('nav').innerHTML=nav.map(([p,i,label])=>`<button class="${page===p?'active':''}" onclick="go('${p}')"><span>${i}</span>${label}</button>`).join('')}render();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
