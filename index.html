function menuPhoto(target){const selected=data.menuImages?.[target];if(safeImage(selected))return safeImage(selected);if(target==='stay'||target==='guide')return safeImage(data.heroImage);if(target==='discover')return safeImage(data.places?.find(x=>safeImage(x.image))?.image);if(target==='food')return safeImage(data.restaurants?.find(x=>safeImage(x.image))?.image);if(target==='experiences')return safeImage(data.activities?.find(x=>safeImage(x.image))?.image);return safeImage(data.heroImage)}
function menuCard(target,title,icon){const photo=menuPhoto(target),copy=MENU_COPY[lang]||MENU_COPY.pt;return `<button class="home-menu-card" onclick="go('${target}')">${photo?`<img class="home-menu-picture" src="${e(photo)}" alt="" loading="lazy">`:`<span class="home-menu-picture home-menu-picture-empty">${ico(icon)}</span>`}<span class="home-menu-copy"><span class="home-menu-title">${ico(icon)}<span>${e(title)}</span></span><span class="home-menu-sub">${e(copy[target]||'')}</span></span><span class="home-menu-arrow">${ico('chevron')}</span></button>`}

function setLanguage(value){if(!['pt','en','es','fr'].includes(value))return;lang=value;localStorage.setItem('guestLang',lang);render()}function go(p){page=p;render();scrollTo(0,0)}function card(icon,title,sub,target){return `<button class="card" onclick="go('${target}')"><span class="ico">${icon}</span><span><strong>${e(title)}</strong></span><span class="arrow">›</span></button>`}function render(){document.documentElement.lang=lang;document.getElementById('globalLanguage').value=lang;let h='';if(page==='home'){const copy=MENU_COPY[lang]||MENU_COPY.pt;h=`<div class="hero" style="--photo:url('${encodeURI(data.heroImage).replaceAll("'",'%27')}')"><div class="brand"><svg class="brand-mark" viewBox="0 0 100 90" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 48 50 13l41 35M23 40v37m54-37v37M50 13v-8"/><path d="M43 70q8-26 27-36M49 58q-12-9-13-17M56 48q12 0 18-10M43 68q-12-1-17-11"/></svg><div>${e(data.brand)}</div><div class="brand-by">by Equicampo</div><div class="brand-rule"></div></div><div class="welcome"><h1>${e(tx('welcome'))}</h1><p>${e(tx('intro'))}</p></div></div><div class="content"><div class="quick">${[['wifi',u(5),'wifi'],['key',u(6),'check'],['compass',QUICK_DIRECTIONS[lang],'directions'],['phone',u(9),'hosts']].map(([ic,tt,pg])=>`<button onclick="go('${pg}')">${ico(ic)}${e(tt)}</button>`).join('')}</div><div class="home-menu">${menuCard('stay',u(1),'bed')}${menuCard('discover',tx('discover'),'compass')}${menuCard('food',tx('food')||EXTRA_LABELS[lang].food,'food')}${menuCard('experiences',tx('experiences'),'star')}${menuCard('useful',u(10),'info')}</div></div>`}else{const titles={stay:u(1),wifi:u(5),check:u(6),guide:tx('guide'),directions:QUICK_DIRECTIONS[lang],discover:tx('discover'),food:tx('food')||EXTRA_LABELS[lang].food,experiences:tx('experiences'),hosts:tx('hosts'),useful:u(10),rules:tx('rules')};h=`<div class="page"><button class="back" onclick="go('home')">← ${e(u(0))}</button><div class="brand" style="color:var(--olive);font-size:23px">${e(data.brand)}</div><h1>${e(titles[page])}</h1>`;if(page==='stay'){const houseGuide=tx('guideBody');if(houseGuide)h+=`<div class="panel"><h2>${e(tx('guide'))}</h2>${e(houseGuide)}</div>`;h+=card('▤',tx('rules'),'','rules')}if(page==='directions'){const dest=safeMap(data.maps);h+=`<div class="panel">${e(data.address||'')}${dest?`<p><a class="action" href="${e(dest)}" target="_blank" rel="noopener noreferrer">${e(QUICK_DIRECTIONS[lang])}</a></p>`:''}</div>`}if(page==='wifi')h+=`<div class="panel"><b>Wi-Fi</b><p>${e(data.wifiName)||'—'}</p><b>Password</b><p>${e(data.wifiPassword)||'—'}</p><button class="action" onclick="navigator.clipboard.writeText(data.wifiPassword).then(()=>alert(u(8)))">${e(u(7))}</button></div>`;if(page==='check')h+=`<div class="panel"><b>Check-in</b><p>${e(data.checkin)||'—'}</p><b>Check-out</b><p>${e(data.checkout)||'—'}</p></div>`;if(['guide','rules'].includes(page))h+=`<div class="panel">${e(tx(page+'Body'))}</div>`;if(page==='discover'){const intro=tx('discoverBody');if(intro)h+=`<div class="place-intro">${e(intro)}</div>`;h+=recommendationCards('discover')}if(page==='food')h+=recommendationCards('food');if(page==='experiences'){const intro=tx('experiencesBody');if(intro)h+=`<div class="place-intro">${e(intro)}</div>`;h+=recommendationCards('experiences')}if(page==='hosts')h+=`<div class="panel">${e(tx('intro'))}</div>${data.whatsapp?`<a class="action" target="_blank" rel="noopener" href="https://wa.me/${encodeURIComponent(data.whatsapp.replace(/\D/g,''))}">WhatsApp</a>`:''}`;if(page==='useful')h+=`<div class="panel">${e(u(11))}<p>${e(data.address)}</p></div>`;h+='</div>'}document.getElementById('app').innerHTML=h+'<div class="footer">Made with care · Casinha D’Aldeia</div>';document.getElementById('nav').innerHTML=[['home','home',u(0)],['stay','bed',u(1)],['discover','compass',u(2)],['experiences','star',u(3)],['hosts','users',u(4)]].map(([p,ic,t])=>`<button class="${page===p?'active':''}" onclick="go('${p}')">${ico(ic)}<span>${e(t)}</span></button>`).join('')}
const previewMode=new URLSearchParams(location.search).get('preview')==='1' && window.parent!==window;
if(previewMode){
  window.addEventListener('message',event=>{
    if(event.origin!==location.origin||event.source!==window.parent)return;
    if(event.data?.type==='casinha-preview-language'){setLanguage(event.data.language);return;}if(event.data?.type!=='casinha-preview-data')return;
    const next=event.data.payload;
    if(!next||typeof next!=='object'||!next.texts||!next.texts.pt)return;
    data=next;render();
  });
  document.getElementById('app').textContent='A preparar a pré-visualização…';
  window.parent.postMessage({type:'casinha-preview-ready'},location.origin);
  // Retry the handshake until the parent sends the preview content.
  let attempts=0;const handshake=setInterval(()=>{
    if(data||++attempts>25){clearInterval(handshake);if(!data)document.getElementById('app').textContent='Não foi possível carregar a pré-visualização. Fecha e abre novamente.';return;}
    window.parent.postMessage({type:'casinha-preview-ready'},location.origin);
  },400);
}else{
  fetch('content.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('content.json');return r.json()}).then(d=>{data=d;render()}).catch(()=>{document.getElementById('app').textContent='Não foi possível carregar o guia. Atualize a página.'});
}
</script></body></html>
